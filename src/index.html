<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover inspiring quotes and meaningful words to motivate and uplift your day with Verse."
    />
    <title>Verse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@100..900&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__content">
          <a href="index.html" class="header__logo" aria-label="Verse Home">
            <img class="header__logo-icon" src="./assets/logo.svg" alt="header-logo" />

            <span class="header__logo-text"> Verse </span>
          </a>

          <nav class="header__navigation" aria-label="Primary navigation">
            <ul class="header__navigation-list">
              <li class="header__navigation-item">
                <a href="#" class="header__navigation-link"> Home </a>
              </li>

              <li class="header__navigation-item">
                <a href="#" class="header__navigation-link"> Explore </a>
              </li>

              <li class="header__navigation-item">
                <a href="#" class="header__navigation-link"> About </a>
              </li>
            </ul>
          </nav>
        </div>

        <div class="header__actions">
          <button class="button button--primary header__cta" type="button">Get inspired</button>

          <button
            class="header__menu-button"
            id="menu-btn"
            type="button"
            aria-label="Open navigation"
            aria-controls="mobile-menu"
            aria-expanded="false"
          >
            <img class="header__menu-icon" id="menu-icon" src="./assets/ham.svg" alt="" />
          </button>
        </div>
      </div>
    </header>

    <nav class="mobile-navigation" id="mobile-menu" aria-label="Mobile navigation">
      <ul class="mobile-navigation__list">
        <li class="mobile-navigation__item">
          <a href="#" class="mobile-navigation__link"> Home </a>
        </li>

        <li class="mobile-navigation__item">
          <a href="#" class="mobile-navigation__link"> Explore </a>
        </li>

        <li class="mobile-navigation__item">
          <a href="#" class="mobile-navigation__link"> About </a>
        </li>
      </ul>

      <button class="button button--primary mobile-navigation__button" type="button">
        Get inspired
      </button>
    </nav>
    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__content">
            <span class="hero__eyebrow">Daily Wisdom</span>

            <h1 class="hero__title">Words that move you.</h1>

            <p class="hero__description">
              A hand-picked quote to start your morning, plus a library to explore whenever you need
              a lift.
            </p>

            <div class="hero__actions">
              <button class="button button--primary hero__button">Get inspired</button>

              <button class="button button--secondary">Browse all</button>
            </div>
          </div>

          <div class="hero__card">
            <div class="hero__card-content">
              <span class="hero__quote-icon">
                <img src="./assets/quotes.svg" alt="quote-icon" />
              </span>

              <blockquote class="hero__quote">The best way out is always through.</blockquote>

              <cite class="hero__author"> — Robert Frost </cite>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
